<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho do Castelo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-xl w-full bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700 text-center">
        <div class="text-6xl mb-4">🏰</div>
        <h1 class="text-4xl font-extrabold text-amber-400 mb-2">Trabalho do Castelo</h1>
        <p class="text-slate-400 mb-6">Aplicação Python containerizada rodando sob Docker e Cloud Infrastructure.</p>
        
        <div class="grid grid-cols-2 gap-4 text-left bg-slate-900 p-4 rounded-xl text-sm mb-6 border border-slate-700/50">
            <div><span class="text-slate-500 block">Linguagem:</span> Python (Flask)</div>
            <div><span class="text-slate-500 block">Ambiente:</span> Docker Container</div>
            <div><span class="text-slate-500 block">Status:</span> <span class="text-emerald-400">● Online</span></div>
            <div><span class="text-slate-500 block">Segurança:</span> HTTPS / SSL</div>
        </div>

        <p class="text-xs text-slate-500">Desenvolvido para a disciplina de Infraestrutura Cloud & DevOps.</p>
    </div>
</body>
</html>
